{% extends "base.html" %}
{% block title %}Login — True Auto Zim{% endblock %}
{% block content %}
<section class="py-5">
  <div class="container">
    <div class="card auth-card mx-auto">
      <div class="card-body p-4 p-md-5">
        <div class="text-center mb-4">
          <div class="brand-badge mx-auto mb-3" style="width: 56px; height: 56px; font-size: 1.6rem;"><i class="bi bi-car-front-fill"></i></div>
          <h3 class="fw-black mb-1">Welcome back</h3>
          <p class="text-muted small mb-0">Log in to track your cars, submit payments & view invoices.</p>
        </div>

        <form method="post" action="{{ url_for('routes.login', next=request.args.get('next')) }}">
          <div class="mb-3">
            <label class="form-label fw-semibold">Email</label>
            <input type="email" name="email" class="form-control" placeholder="you@example.com" required autofocus>
          </div>
          <div class="mb-4">
            <label class="form-label fw-semibold">Password</label>
            <input type="password" name="password" class="form-control" placeholder="••••••••" required>
          </div>
          <div class="d-grid">
            <button type="submit" class="btn btn-accent btn-lg rounded-pill"><i class="bi bi-box-arrow-in-right me-1"></i> Log in</button>
          </div>
        </form>

        <p class="text-center text-muted small mt-4 mb-0">
          New to True Auto Zim? <a href="{{ url_for('routes.register') }}" class="fw-semibold text-accent-dark">Create an account</a>
        </p>
        <p class="text-center text-muted small mt-2 mb-0">
          Demo login: <code>demo@trueautozim.co.zw / Demo123!</code>
        </p>
      </div>
    </div>
  </div>
</section>
{% endblock %}
