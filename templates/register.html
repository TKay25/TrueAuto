{% extends "base.html" %}
{% block title %}Create Account — True Auto Zim{% endblock %}
{% block content %}
<section class="py-5">
  <div class="container">
    <div class="card auth-card mx-auto">
      <div class="card-body p-4 p-md-5">
        <div class="text-center mb-4">
          <div class="brand-badge mx-auto mb-3" style="width: 56px; height: 56px; font-size: 1.6rem;"><i class="bi bi-person-plus-fill"></i></div>
          <h3 class="fw-black mb-1">Create your account</h3>
          <p class="text-muted small mb-0">Track orders, submit payments and manage your cars.</p>
        </div>

        <form method="post" action="{{ url_for('routes.register') }}">
          <div class="mb-3">
            <label class="form-label fw-semibold">Full name</label>
            <input type="text" name="name" class="form-control" placeholder="Tendai Moyo" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Email</label>
            <input type="email" name="email" class="form-control" placeholder="you@example.com" required>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Phone / WhatsApp</label>
            <input type="text" name="phone" class="form-control" placeholder="+263 7x xxx xxxx" required>
          </div>
          <div class="row g-3 mb-4">
            <div class="col-md-6">
              <label class="form-label fw-semibold">Password</label>
              <input type="password" name="password" class="form-control" placeholder="Min 6 characters" required>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Confirm password</label>
              <input type="password" name="confirm" class="form-control" placeholder="Repeat password" required>
            </div>
          </div>
          <div class="d-grid">
            <button type="submit" class="btn btn-accent btn-lg rounded-pill"><i class="bi bi-person-check me-1"></i> Create account</button>
          </div>
        </form>

        <p class="text-center text-muted small mt-4 mb-0">
          Already have an account? <a href="{{ url_for('routes.login') }}" class="fw-semibold text-accent-dark">Log in</a>
        </p>
      </div>
    </div>
  </div>
</section>
{% endblock %}
